version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: piprobe_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  influxdb:
    image: influxdb:1.8
    container_name: piprobe_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=piprobe
    volumes:
      - influxdb_data:/var/lib/influxdb

  telegraf:
    image: telegraf:latest
    container_name: piprobe_telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: piprobe_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me-before-deployment}
    volumes:
      - grafana_data:/var/lib/grafana

  dashboard:
    build:
      context: ../dashboard
    container_name: piprobe_dashboard
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "8888:8888"

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  grafana_data:
