[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "5s"
  precision = "1s"
  logfile = ""
  debug = false
  quiet = false

# InfluxDB 1.x output. The dashboard and native Pi deployment use InfluxQL.
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "piprobe"
  retention_policy = "autogen"
  username = ""
  password = ""

# MQTT Consumer Ingest
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "piprobe/+/+"
  ]
  qos = 0
  connection_timeout = "10s"
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "unix"
  
  # Topic parsing: piprobe/<probe_id>/<layer>
  topic_tag = "topic"
  
  # Specify tags from incoming JSON
  tag_keys = [
    "probe_id",
    "layer",
    "room_id",
    "bssid",
    "channel",
    "fault_class",
    "run_id",
    "split",
    "site_id",
    "session_id",
    "location_id",
    "carrier_name",
    "network_type",
    "data_state",
    "provider",
    "sim_slot",
    "cell_type"
  ]
  
  # Override measurement name
  name_override = "network_telemetry"
